[package]
name = "tpp-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One cache contract over Redis, Dragonfly, memcached and Cloudflare Workers KV: document, volatile, indexed and read-through strategies"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["cache", "redis", "memcached", "async", "read-through"]
categories = ["caching", "asynchronous"]

# Consumed by tools/docgen to build the README's "Go source" column.
[package.metadata.docgen]
go-source = "runtime-go/cache"
use-for = "Cache values in Redis, Dragonfly, memcached or Workers KV, read through to a slower source, and purge Cloudflare's CDN"

[lib]
name = "cache"

[features]
default = []
live-tests = []

[dependencies]
telemetry.workspace = true
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
redis.workspace = true
memcache = { version = "0.21", default-features = false, features = ["tokio"] }
crc32fast = "1.5"
cloudflare.workspace = true
network.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test = { workspace = true }
wiremock = { workspace = true }

[[test]]
name = "redis_live"
path = "tests/redis_live.rs"
required-features = ["live-tests"]

[[test]]
name = "memcached_live"
path = "tests/memcached_live.rs"
required-features = ["live-tests"]

[[test]]
name = "dragonfly_live"
path = "tests/dragonfly_live.rs"
required-features = ["live-tests"]

[[bench]]
name = "redis_paths"
path = "benches/redis_paths.rs"
harness = false
required-features = ["live-tests"]
