[package]
name = "runtime-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cache drivers and read-through/write-through strategies over pluggable backends"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["cache", "redis", "memcached", "async", "read-through"]
categories = ["caching", "asynchronous"]

# Consumed by tools/docgen to build the README's "Go source" column.
[package.metadata.docgen]
go-source = "runtime-go/cache"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test = { workspace = true }
