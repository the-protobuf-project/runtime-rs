# Isolated service for runtime-cache's explicitly enabled Memcached integration test.
#
# Start:
#   docker compose -p runtime-cache-memcached-live -f cache/docker/compose.memcached.live.yaml up -d --wait memcached
# Stop:
#   docker compose -p runtime-cache-memcached-live -f cache/docker/compose.memcached.live.yaml down

services:
  memcached:
    image: memcached:1.6-alpine
    ports:
      - "127.0.0.1:11212:11211"
    healthcheck:
      test:
        - CMD-SHELL
        - 'printf "version\r\n" | nc -w 1 127.0.0.1 11211 | grep -q "^VERSION "'
      interval: 1s
      timeout: 3s
      retries: 20
    restart: "no"
