[package]
name = "tpp-network-graphql"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Predicate/filter/query-builder helpers for generated GraphQL CRUD clients"
repository = "https://github.com/the-protobuf-project/runtime-rs"
readme = "README.md"
keywords = ["graphql", "query-builder", "predicate", "crud", "filter"]
categories = ["web-programming"]

# Consumed by tools/docgen to build the README's "Go source" column.
[package.metadata.docgen]
go-source = "runtime-go/network/graphql"

[lib]
name = "network_graphql"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
