[package]
name = "tpp-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared runtime metrics, correlated logs and cancellation-safe tracing over caller-owned providers"
repository = "https://github.com/the-protobuf-project/runtime-rs"

[package.metadata.docgen]
go-source = "runtime-go/telemetry"
use-for = "Trace, measure and log all of the above"

[lib]
name = "telemetry"

[features]
default = []
tpp-sdk = ["dep:telemetry-sdk"]
# In-memory signals for other crates' tests; see the testing module.
testing = ["dep:opentelemetry_sdk"]

[dependencies]
opentelemetry.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.34"
opentelemetry_sdk = { version = "0.33", features = ["testing"], optional = true }
# The application SDK, at its newest release, with every feature it ships
# (continuous profiling to Pyroscope included).
telemetry-sdk = { package = "telemetry-rs", git = "https://github.com/the-protobuf-project/telemetry", tag = "v1.3.3", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tokio.workspace = true
futures.workspace = true
