[package]
name = "tpp-grpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One server speaking gRPC, a JSON/REST gateway, optional HTTP/3, and the agent protocols on shared TLS"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["grpc", "tonic", "http3", "gateway", "server"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

# Consumed by tools/docgen to build the README's "Go source" column.
[package.metadata.docgen]
go-source = "runtime-go/grpc"
use-for = "Serve one service over gRPC, REST, HTTP/3, MCP and A2A on one port"

[lib]
name = "grpc"

[features]
default = ["tls", "http3", "a2a"]
# TLS for gRPC, the REST gateway and HTTP/3, on rustls with ring. A feature because ring
# is C: with it off nothing in this crate's graph needs a C compiler, which is what lets a
# local daemon serving only a Unix socket or named pipe cross-compile with Cargo alone.
tls = ["tonic/tls-ring", "dep:rustls", "dep:rustls-pemfile", "dep:tokio-rustls"]
# HTTP/3 pulls in QUIC. It is a feature rather than a hard dependency because the
# gateway is complete without it and quinn is a large tree to build for nothing. QUIC has
# no plaintext mode, so it brings TLS with it.
http3 = ["tls", "dep:h3", "dep:h3-quinn", "dep:quinn"]
# Agent2Agent. A feature because its SDK brings reqwest and aws-lc, which a server speaking
# gRPC, REST and MCP has no use for. MCP has no feature of its own: the server is written
# against it throughout.
a2a = ["agents/a2a"]

[dependencies]
agents = { workspace = true, features = ["mcp"] }

tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tonic-web = { workspace = true }
transcode = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }

rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
owo-colors = { workspace = true }
unicode-width = { workspace = true }
async-trait = { workspace = true }
telemetry = { workspace = true }
tonic-types = { workspace = true }
prost-protovalidate = { workspace = true }
sha2 = { workspace = true }

h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
unicode-width = { workspace = true }
opentelemetry_sdk = { version = "0.33", features = ["testing", "trace", "metrics"] }
telemetry = { workspace = true, features = ["testing"] }
tonic-prost = { workspace = true }
tokio-stream = { workspace = true }
tonic-prost-build = { workspace = true }
# A real MCP client over a Unix socket, for tests/no_tcp.rs.
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-unix-socket"] }
