[package]
name = "tpp-grpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "One server speaking gRPC, a JSON/REST gateway, optional HTTP/3, and the agent protocols on shared TLS"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["grpc", "tonic", "http3", "gateway", "server"]
categories = ["network-programming", "web-programming::http-server", "asynchronous"]

# Consumed by tools/docgen to build the README's "Go source" column.
[package.metadata.docgen]
go-source = "runtime-go/grpc"

[lib]
name = "grpc"

[features]
default = ["http3"]
# HTTP/3 pulls in QUIC. It is a feature rather than a hard dependency because the
# gateway is complete without it and quinn is a large tree to build for nothing.
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn"]

[dependencies]
agents = { workspace = true }

tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls-ring"] }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true }
tonic-web = { workspace = true }
transcode = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }

rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
owo-colors = { workspace = true }
unicode-width = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }

h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
agents = { workspace = true }
unicode-width = { workspace = true }
opentelemetry_sdk = { version = "0.33", features = ["testing", "trace", "metrics"] }
