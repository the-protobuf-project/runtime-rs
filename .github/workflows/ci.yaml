name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Detect which crates the workspace contains so we can fan-out per
  # crate. Reading this from cargo metadata rather than hardcoding it
  # means a new workspace member gets its own job the moment it is added
  # to Cargo.toml — a hardcoded list silently skips it instead.
  #
  # The MSRV is read from the same metadata (workspace.package
  # rust-version) so the manifest stays the single source of truth; a
  # constant duplicated here would drift the moment the manifest moved.
  # ------------------------------------------------------------------
  detect-crates:
    name: Detect crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      msrv: ${{ steps.set-matrix.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Read workspace members and emit matrix
        id: set-matrix
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)

          crates=$(jq -c '[.packages[].name] | sort' <<< "$metadata")
          echo "Workspace crates: $crates"
          echo "matrix={\"crate\":$crates}" >> "$GITHUB_OUTPUT"

          # Highest rust-version across the members: the toolchain that
          # every crate is required to build under.
          msrv=$(jq -r '[.packages[].rust_version // empty] | max // empty' <<< "$metadata")
          if [ -z "$msrv" ]; then
            echo "No rust-version declared by any workspace crate." >&2
            exit 1
          fi
          echo "Workspace MSRV: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build and test every crate in parallel, so a failure names the crate
  # that broke rather than just "the workspace".
  # ------------------------------------------------------------------
  test:
    name: Test (${{ matrix.crate }})
    needs: detect-crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-crates.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p ${{ matrix.crate }} --all-targets

      - name: Test
        run: cargo test -p ${{ matrix.crate }}

  # ------------------------------------------------------------------
  # The crates also have to work together: per-crate jobs resolve
  # features independently, so this catches breakage that only appears
  # under the workspace's unified feature set.
  # ------------------------------------------------------------------
  workspace:
    name: Test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # ------------------------------------------------------------------
  # Lint — formatting and clippy, warnings denied. Kept as one
  # workspace-wide job rather than fanned out per crate: clippy shares a
  # single dependency build across the workspace, so splitting it would
  # rebuild the same dependencies once per crate for no extra signal.
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # tools/docgen is excluded from the workspace, so --workspace above
      # does not reach it. Held to the same bar rather than left to rot.
      - name: Format check (tools/docgen)
        run: cargo fmt --manifest-path tools/docgen/Cargo.toml --check

      - name: Clippy (tools/docgen)
        run: cargo clippy --manifest-path tools/docgen/Cargo.toml --all-targets -- -D warnings

  # ------------------------------------------------------------------
  # Docs — every public item must carry a doc comment (enforced by
  # #![warn(missing_docs)] in each crate) and every intra-doc link must
  # resolve; both are promoted to hard errors here.
  #
  # rustdoc cannot see the README, so tools/docgen covers what it misses:
  # a crate with no crate-level docs or no manifest description, and a
  # README crate table that no longer matches the workspace.
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build docs (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - uses: extractions/setup-just@v3

      - name: Validate crate docs + README freshness
        run: just docs-check

  # ------------------------------------------------------------------
  # MSRV — the workspace must build on the minimum Rust version it
  # declares (workspace.package.rust-version).
  # ------------------------------------------------------------------
  msrv:
    name: MSRV (${{ needs.detect-crates.outputs.msrv }})
    needs: detect-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.detect-crates.outputs.msrv }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV toolchain
        run: cargo build --workspace --all-targets --locked

  # ------------------------------------------------------------------
  # Security audit — every dependency against the RustSec advisory
  # database. Non-blocking noise (informational advisories) can be
  # suppressed with a .cargo/audit.toml ignore list if it ever comes up.
  # ------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  # ------------------------------------------------------------------
  # Single status gate that PRs can require before merge. Reading the
  # results out of `needs` keeps this correct as jobs are added — only
  # the needs list below has to be maintained.
  # ------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [detect-crates, test, workspace, lint, docs, msrv, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
          if jq -e 'any(.[]; .result != "success")' >/dev/null <<< "$RESULTS"; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
