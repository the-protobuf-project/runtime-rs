name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Detect which crates the workspace contains so we can fan-out per
  # crate. Reading this from cargo metadata rather than hardcoding it
  # means a new workspace member gets its own job the moment it is added
  # to Cargo.toml — a hardcoded list silently skips it instead.
  #
  # The MSRV is read from the same metadata (workspace.package
  # rust-version) so the manifest stays the single source of truth; a
  # constant duplicated here would drift the moment the manifest moved.
  # ------------------------------------------------------------------
  detect-crates:
    name: Detect crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      msrv: ${{ steps.set-matrix.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Read workspace members and emit matrix
        id: set-matrix
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)

          crates=$(jq -c '[.packages[].name] | sort' <<< "$metadata")
          echo "Workspace crates: $crates"
          echo "matrix={\"crate\":$crates}" >> "$GITHUB_OUTPUT"

          # Highest rust-version across the members: the toolchain that
          # every crate is required to build under.
          msrv=$(jq -r '[.packages[].rust_version // empty] | max // empty' <<< "$metadata")
          if [ -z "$msrv" ]; then
            echo "No rust-version declared by any workspace crate." >&2
            exit 1
          fi
          echo "Workspace MSRV: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Build and test every crate in parallel, so a failure names the crate
  # that broke rather than just "the workspace".
  # ------------------------------------------------------------------
  test:
    name: Test (${{ matrix.crate }})
    needs: detect-crates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-crates.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p ${{ matrix.crate }} --all-targets

      - name: Test
        run: cargo test -p ${{ matrix.crate }}

  # ------------------------------------------------------------------
  # The crates also have to work together: per-crate jobs resolve
  # features independently, so this catches breakage that only appears
  # under the workspace's unified feature set.
  # ------------------------------------------------------------------
  workspace:
    name: Test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # ------------------------------------------------------------------
  # The database crate's SQL backend sits behind the `orm` features, so
  # the per-crate and workspace jobs (default features) never build it.
  # Here: SQLite in-process with the ordinary suite, then the live
  # Postgres and MySQL tests against service containers on the same
  # high ports database/docker/compose.orm.live.yaml uses locally.
  # ------------------------------------------------------------------
  database-sql:
    name: Test (tpp-database, SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runtime
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runtime"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: runtime
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      RUNTIME_DATABASE_POSTGRES_ADDRESS: 127.0.0.1:15432
      RUNTIME_DATABASE_MYSQL_ADDRESS: 127.0.0.1:13306
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test (SQLite in-process, with the ordinary suite)
        run: cargo test -p tpp-database --features orm

      # D1 is SQLite over HTTP; its test serves a stand-in API over in-process SQLite.
      - name: Test (D1 against an in-process stand-in)
        run: cargo test -p tpp-database --features d1,orm-sqlite --test d1

      - name: Test (live Postgres and MySQL)
        run: cargo test -p tpp-database --features orm,live-tests --test orm_live

  # ------------------------------------------------------------------
  # Lint — formatting and clippy, warnings denied. Kept as one
  # workspace-wide job rather than fanned out per crate: clippy shares a
  # single dependency build across the workspace, so splitting it would
  # rebuild the same dependencies once per crate for no extra signal.
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Feature-gated code the workspace run does not compile: the SQL, MongoDB and
      # cached backends of database are off by default.
      - name: Clippy (tpp-cache, cdn)
        run: cargo clippy -p tpp-cache --all-targets --features cdn -- -D warnings

      # The per-crate test job builds default features, which leave cdn out.
      - name: Test (tpp-cache, cdn)
        run: cargo test -p tpp-cache --features cdn --lib cdn

      - name: Clippy (tpp-database, all features)
        run: cargo clippy -p tpp-database --all-targets --features orm,mongodb,redis,cached,d1,live-tests -- -D warnings

      # servicex alone, as a generated service depends on it: no server stack,
      # and with the standard methods over repositories.
      - name: Clippy (tpp-grpc servicex, no server)
        run: |
          cargo clippy -p tpp-grpc --no-default-features --lib -- -D warnings
          cargo clippy -p tpp-grpc --no-default-features --features servicex-store --lib -- -D warnings

      # tools/docgen is excluded from the workspace, so --workspace above
      # does not reach it. Held to the same bar rather than left to rot.
      - name: Format check (tools/docgen)
        run: cargo fmt --manifest-path tools/docgen/Cargo.toml --check

      - name: Clippy (tools/docgen)
        run: cargo clippy --manifest-path tools/docgen/Cargo.toml --all-targets -- -D warnings

  # ------------------------------------------------------------------
  # Docs — every public item must carry a doc comment (enforced by
  # #![warn(missing_docs)] in each crate) and every intra-doc link must
  # resolve; both are promoted to hard errors here.
  #
  # rustdoc cannot see the README, so tools/docgen covers what it misses:
  # a crate with no crate-level docs or no manifest description, and a
  # README crate table that no longer matches the workspace.
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build docs (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      - name: Build docs (tpp-database, all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p tpp-database --no-deps --features orm,mongodb,redis,cached,d1,live-tests

      - name: Build docs (tpp-cache, cdn)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p tpp-cache --no-deps --features cdn

      - uses: extractions/setup-just@v4

      - name: Validate crate docs + README freshness
        run: just docs-check

  # ------------------------------------------------------------------
  # Live — the targets that need a real server, each against the same
  # isolated Compose service a developer starts locally. They are
  # selected by a `live-tests` feature rather than ignored, so an
  # unreachable service fails the job instead of passing it empty.
  # ------------------------------------------------------------------
  live:
    name: Live (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: cache redis
            project: runtime-cache-live
            compose: cache/docker/compose.live.yaml
            test: cargo test -p tpp-cache --features live-tests --test redis_live
          - name: cache dragonfly
            project: runtime-cache-dragonfly-live
            compose: cache/docker/compose.dragonfly.live.yaml
            test: cargo test -p tpp-cache --features live-tests --test dragonfly_live
          - name: cache memcached
            project: runtime-cache-memcached-live
            compose: cache/docker/compose.memcached.live.yaml
            test: cargo test -p tpp-cache --features live-tests --test memcached_live
          - name: database redis
            project: tpp-database-redis-live
            compose: database/docker/compose.redis.live.yaml
            test: cargo test -p tpp-database --features redis,live-tests --test redis_live
          # A single-node replica set: transactions and change streams need one.
          - name: database mongodb
            project: runtime-database-mongodb-live
            compose: database/docker/compose.mongodb.live.yaml
            test: cargo test -p tpp-database --features mongodb,live-tests --test mongodb_live
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start service
        run: docker compose -p ${{ matrix.suite.project }} -f ${{ matrix.suite.compose }} up -d --wait

      - name: Test
        run: ${{ matrix.suite.test }}

      - name: Service logs on failure
        if: failure()
        run: docker compose -p ${{ matrix.suite.project }} -f ${{ matrix.suite.compose }} logs

      - name: Stop service
        if: always()
        run: docker compose -p ${{ matrix.suite.project }} -f ${{ matrix.suite.compose }} down

  # ------------------------------------------------------------------
  # MSRV — the workspace must build on the minimum Rust version it
  # declares (workspace.package.rust-version).
  # ------------------------------------------------------------------
  msrv:
    name: MSRV (${{ needs.detect-crates.outputs.msrv }})
    needs: detect-crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.detect-crates.outputs.msrv }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV toolchain
        run: cargo build --workspace --all-targets --locked

  # ------------------------------------------------------------------
  # Security audit — every dependency against the RustSec advisory
  # database. Non-blocking noise (informational advisories) can be
  # suppressed with a .cargo/audit.toml ignore list if it ever comes up.
  # ------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  # ------------------------------------------------------------------
  # database::cached sits behind the off-by-default `cached` feature, so
  # the per-crate, lint and docs jobs above never build it. This job
  # lints and documents it, then runs its in-process suite and its live
  # suite against a Redis service on the port tpp-cache's live tests
  # default to, 127.0.0.1:16379. `live-tests` makes a missing server a
  # failure rather than a skip.
  # ------------------------------------------------------------------
  database-cached:
    name: Database cache (live Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (cached)
        run: cargo clippy -p tpp-database --all-targets --features cached,live-tests -- -D warnings

      - name: Docs (cached)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p tpp-database --no-deps --features cached

      - name: Test (in-process and live Redis)
        env:
          RUNTIME_CACHE_REDIS_ADDRESS: 127.0.0.1:16379
        run: >-
          cargo test -p tpp-database --features cached,live-tests
          --test cached --test cached_capabilities --test cached_live

  # ------------------------------------------------------------------
  # The Tauri store backend. On Linux, tauri-runtime links WebKitGTK and
  # GTK whatever Tauri's features, so this is the one job that installs
  # them; the lint and docs jobs above name the server backends rather
  # than --all-features.
  # ------------------------------------------------------------------
  database-tauri-store:
    name: Database (Tauri store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # WebKitGTK 4.1's headers bring GTK 3, libsoup 3 and JavaScriptCore's:
      # every system library the Linux build links (Tauri's own prerequisites).
      - name: Install WebKitGTK and GTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Clippy (tauri-store)
        run: cargo clippy -p tpp-database --all-targets --features tauri-store-test -- -D warnings

      - name: Docs (tauri-store)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p tpp-database --no-deps --features tauri-store

      - name: Test (mock runtime)
        run: cargo test -p tpp-database --features tauri-store-test --test tauri_store --lib

  # ------------------------------------------------------------------
  # Single status gate that PRs can require before merge. Reading the
  # results out of `needs` keeps this correct as jobs are added — only
  # the needs list below has to be maintained.
  # ------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [detect-crates, test, workspace, database-sql, database-cached, database-tauri-store, live, lint, docs, msrv, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
          if jq -e 'any(.[]; .result != "success")' >/dev/null <<< "$RESULTS"; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
