name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MSRV: "1.93"

jobs:
  # ------------------------------------------------------------------
  # Build and test each crate individually (clear per-crate status),
  # plus the whole workspace together (catches cross-crate breakage).
  # ------------------------------------------------------------------
  test:
    name: Test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [tpp-network, tpp-network-graphql, tpp-runtime, workspace]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          if [ "${{ matrix.crate }}" = "workspace" ]; then
            cargo build --workspace --all-targets
          else
            cargo build -p ${{ matrix.crate }} --all-targets
          fi

      - name: Test
        run: |
          if [ "${{ matrix.crate }}" = "workspace" ]; then
            cargo test --workspace
          else
            cargo test -p ${{ matrix.crate }}
          fi

  # ------------------------------------------------------------------
  # Lint — formatting and clippy, warnings denied.
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ------------------------------------------------------------------
  # Docs — every public item must carry a doc comment (enforced by
  # #![warn(missing_docs)] in each crate) and every intra-doc link must
  # resolve; both are promoted to hard errors here.
  # ------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build docs (warnings as errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  # ------------------------------------------------------------------
  # MSRV — the workspace must build on the minimum Rust version it
  # declares (workspace.package.rust-version).
  # ------------------------------------------------------------------
  msrv:
    name: MSRV (${{ env.MSRV }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - uses: Swatinem/rust-cache@v2

      - name: Build with MSRV toolchain
        run: cargo build --workspace --all-targets --locked

  # ------------------------------------------------------------------
  # Security audit — every dependency against the RustSec advisory
  # database. Non-blocking noise (informational advisories) can be
  # suppressed with a .cargo/audit.toml ignore list if it ever comes up.
  # ------------------------------------------------------------------
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit

  # ------------------------------------------------------------------
  # Single status gate that PRs can require before merge.
  # ------------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [test, lint, docs, msrv, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.docs.result }}" != "success" || "${{ needs.msrv.result }}" != "success" || "${{ needs.audit.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
