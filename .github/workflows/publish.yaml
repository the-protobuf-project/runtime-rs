name: Publish to crates.io

# Manual only — nothing in this repo ever publishes automatically.
#
# Order matters for one pair: tpp-grpc depends on tpp-agents, so a release that
# bumps both publishes tpp-agents first. The rest are independent.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - tpp-network
          - tpp-cache
          - tpp-agents
          - tpp-grpc
      dry_run:
        description: "Dry run only (no upload)"
        required: true
        type: boolean
        default: true

jobs:
  publish:
    name: Publish ${{ inputs.crate }}
    runs-on: ubuntu-latest
    # Configure a "crates-io" environment with required reviewers in repo
    # settings to gate real (non-dry-run) publishes behind manual approval.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Resolved from cargo metadata rather than a hardcoded table, so a
      # crate whose directory name differs from its package name (as they
      # all do here) can never be mapped to the wrong path. Only the
      # `crate` input's option list above needs touching for a new crate;
      # GitHub Actions cannot populate choice inputs dynamically.
      - name: Resolve package directory
        id: dir
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c '${{ inputs.crate }}' \
                '.packages[] | select(.name == $c) | .manifest_path')
          if [ -z "$manifest" ]; then
            echo "No workspace member named '${{ inputs.crate }}'." >&2
            exit 1
          fi
          echo "path=$(dirname "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test -p ${{ inputs.crate }}

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: ${{ steps.dir.outputs.path }}
        run: cargo publish --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ steps.dir.outputs.path }}
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
