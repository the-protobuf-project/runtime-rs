# Mosquitto for tests/mqtt_e2e.rs: one listener, MQTT over TLS with mutual
# authentication, and sessions persisted to disk.
#
# There is no plaintext listener at all. A client must present a certificate
# signed by the test CA; its common name becomes its username, so nobody
# connects anonymously.
listener 8883 0.0.0.0
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
use_identity_as_username true
allow_anonymous false
tls_version tlsv1.2

# Durable sessions, their subscriptions, and their queued and in-flight QoS 1
# messages are written to the named volume, every second and on shutdown, so a
# `docker restart` resumes rather than forgets.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
autosave_on_changes false

# Keep messages for offline persistent sessions; QoS 0 is never queued.
max_queued_messages 10000
queue_qos0_messages false

log_dest stdout
log_type error
log_type warning
log_type notice

# Publish $SYS statistics every second; tests/mqtt_e2e.rs reads the client and
# subscription counts to prove a dropped subscription leaves nothing behind.
sys_interval 1
