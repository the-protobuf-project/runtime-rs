# Mosquitto for tests/mqtt_e2e.rs: two listeners, both MQTT over TLS with
# mutual authentication, and sessions persisted to disk.
#
# There is no plaintext listener at all. Every client must present a
# certificate signed by the test CA. What identifies it then depends on the
# port:
#
#   8883 (host 18883)  the certificate's common name is the username, and
#                      that is the whole of authentication.
#   8884 (host 18884)  the certificate only opens the connection; the client
#                      logs in with a username and password from
#                      password_file, and acl_file confines it to its topics.
#
# The password and ACL checks are Mosquitto 2.1's own plugins, loaded once
# and used by the 8884 listener only (the per-listener form that replaces the
# deprecated per_listener_settings). Both files are written by the container's
# start command (compose.mqtt.secure.yaml): the password file by
# mosquitto_passwd, the ACLs copied from compose.mqtt.secure.acl.
plugin_load passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/passwd
plugin_load acls /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/auth/acl

listener 8883 0.0.0.0
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
use_identity_as_username true
listener_allow_anonymous false
tls_version tlsv1.2

listener 8884 0.0.0.0
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
use_identity_as_username false
listener_allow_anonymous false
tls_version tlsv1.2
plugin_use passwords
plugin_use acls

# Durable sessions, their subscriptions, and their queued and in-flight QoS 1
# messages are written to the named volume, every second and on shutdown, so a
# `docker restart` resumes rather than forgets.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
autosave_on_changes false

# Keep messages for offline persistent sessions; QoS 0 is never queued.
max_queued_messages 10000
queue_qos0_messages false

log_dest stdout
log_type error
log_type warning
log_type notice

# Publish $SYS statistics every second; tests/mqtt_e2e.rs reads the client and
# subscription counts to prove a dropped subscription leaves nothing behind.
sys_interval 1
