# Mosquitto 2 refuses anonymous clients and listens on localhost only unless
# told otherwise; this broker is for local experiments, so allow both. The
# 0.0.0.0 is the container's interface: compose publishes it on 127.0.0.1 only.
listener 1883 0.0.0.0
allow_anonymous true
persistence false

# Mosquitto's defaults are tuned for small devices: 20 QoS 1 publishes in
# flight per client (sent to MQTT 5 clients as the CONNACK's Receive Maximum,
# so one publishing connection waits a round trip per 20 messages), and 1000
# queued per session before it silently drops the rest. Raised for the
# throughput bench (benches/throughput), where either would be the limit.
max_inflight_messages 1000
max_queued_messages 1000000
max_queued_bytes 0
