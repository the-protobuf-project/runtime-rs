# Mounted into the broker by compose.rabbitmq.secure.yaml as
# /etc/rabbitmq/conf.d/20-secure.conf, after the image's own defaults.

# AMQPS only: the plaintext AMQP listener is off.
listeners.tcp = none
listeners.ssl.default = 5671

# Mutual TLS: the server presents server.crt and refuses a client that does
# not present a certificate signed by the test CA.
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/server.crt
ssl_options.keyfile = /certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# The management UI and its HTTP API stay inside the container: no port is
# published for them, and they listen on loopback only.
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672

# guest is let in from outside the container only because the published port is
# bound to the host loopback and the connection is mutually authenticated.
loopback_users.guest = false
