# A single-node KRaft Kafka for tests/kafka_live.rs and examples/kafka.rs.
#
#   docker compose -f docker/compose.kafka.yaml up -d --wait
#   cargo test --features kafka,live-tests --test kafka_live
#
# Host port 19092, not 9092, so it can run beside a Kafka you already have.
# Two listeners because a client is told to reconnect at the advertised
# address: the host one advertises 127.0.0.1:19092, which means nothing inside
# the container, so the healthcheck uses an internal one of its own.
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: tpp-streams-kafka
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:19092,INTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so every internal topic can have only one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Tests join fresh groups constantly; the default 3s wait is per join.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: "no"
