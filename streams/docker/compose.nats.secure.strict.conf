# JetStream for compose.nats.secure.yaml with STREAMS_DURABILITY=strict (the
# default): fsync every write before the publish ack goes out, so an acked
# message survives the container (or the VM under it) being killed, not only
# a graceful stop. What tests/nats_e2e.rs runs against.

jetstream {
  store_dir: "/data"
  sync_interval: always
}
