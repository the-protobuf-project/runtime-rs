# A Redis with mutual TLS and an append-only file, for tests/redis_e2e.rs.
#
#   docker compose -p tpp-streams-e2e-redis -f streams/docker/compose.redis.secure.yaml up -d --wait
#   STREAMS_E2E_RESTART=1 cargo test -p tpp-streams --features redis,tls,live-tests --test redis_e2e
#   docker compose -p tpp-streams-e2e-redis -f streams/docker/compose.redis.secure.yaml down -v
#
# Certificates come from tls/generate.sh (tls/out). The plaintext port is off
# (`--port 0`), so the only way in is TLS on 6380, published on 127.0.0.1:16381,
# and `--tls-auth-clients yes` refuses a client that presents no certificate
# signed by the CA.
#
# Durability: an append-only file on the named volume `redis-secure-data`, so
# stream entries, consumer groups, their pending lists, and scheduled keys with
# their absolute expiry all survive `docker restart`. How often it is fsynced is
# chosen by STREAMS_DURABILITY when the container starts:
#
#   strict (default)  `appendfsync always`: every write is on disk before Redis
#                     answers it, so an acknowledged XADD survives even a power
#                     cut. Each write batch costs an fsync, which caps
#                     throughput at what the disk (here Docker Desktop's VM
#                     disk) can sync. The e2e suite runs this way.
#   prod              `appendfsync everysec`, Redis's own default for AOF: the
#                     file is fsynced once a second in the background, so a
#                     process crash or `docker restart` loses nothing (the
#                     kernel still has the writes) but a host or VM crash can
#                     lose up to about a second of acknowledged writes. This is
#                     what the throughput bench's `tls` profile is meant for.
#
#   STREAMS_DURABILITY=prod docker compose -p tpp-streams-e2e-redis -f streams/docker/compose.redis.secure.yaml up -d --wait
#
# Keyspace expiry events are on because scheduled delivery is built on them.
#
# Authentication: ACL users from compose.redis.secure.acl, on top of mTLS. The
# certificate gets a client onto the socket; the user decides what it may do.
# Passwords are test-only and stored as SHA-256 in the file; the plaintext is
# in tests/redis_e2e.rs and the healthcheck below.
#
#   default   off, with no password: no connection can log in as it, and an
#             unauthenticated one can run nothing but AUTH/HELLO. It keeps +@all
#             on purpose: Redis 7.4 replays the AOF's MULTI/EXEC blocks (the
#             driver's own transactions, and the XCLAIM + XGROUP SETID that
#             XREADGROUP propagates) as the default user and re-checks them at
#             EXEC, so a default user with `nocommands` makes a restart silently
#             drop every transaction ("ACLs rules changed ... no longer allowed"
#             in the log): groups forget what they read, schedules vanish.
#             tests/redis_e2e.rs survives_a_broker_restart catches exactly that.
#   streams   what the driver needs and nothing else; tests run the provider as it.
#   admin     everything; only the test's inspection helpers and the healthcheck.
#
# The streams user, rule by rule:
#   keys      ~e2e*:stream:* ~e2e*:notify:* ~e2e*:durable:* - the driver's three
#             namespaces (<prefix>:<kind>:...) under the tests' e2e<id> prefixes.
#   channels  &e2e*:stream:ch:* for pub/sub subjects, and only database 3's
#             &__keyevent@3__:expired for scheduled delivery (the tests' DB).
#   connect   ping hello auth select, and client|setinfo, which redis-rs sends
#             on every connect to name itself (it ignores a refusal, but each
#             one would land in ACL LOG as noise).
#   pub/sub   publish subscribe unsubscribe.
#   scheduled set (payload, and pending with PX), getdel (claim), and
#             multi exec discard because a schedule is one transaction.
#   lifecycle xadd xtrim xrange (metadata), del, scan + type (list).
#   durable   xadd xrevrange xread xreadgroup xautoclaim xpending xack, and of
#             XGROUP only create and delconsumer. xclaim for a delayed nak,
#             which claims the entry back to its own consumer with IDLE and
#             JUSTID so the reclaim reaches it only once the delay has passed.
# Nothing else: no CONFIG, KEYS, FLUSH*, EVAL, XINFO, or XGROUP DESTROY.
services:
  redis:
    image: redis:7-alpine
    container_name: tpp-streams-redis-secure
    ports:
      - "127.0.0.1:16381:6380"
    volumes:
      - ./tls/out:/certs:ro
      - ./compose.redis.secure.acl:/etc/redis/users.acl:ro
      - redis-secure-data:/data
    environment:
      STREAMS_DURABILITY: ${STREAMS_DURABILITY:-strict}
    # Maps STREAMS_DURABILITY onto --appendfsync and hands everything in
    # `command` to the image's own entrypoint, which drops to the redis user.
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$STREAMS_DURABILITY" in
          strict) fsync=always ;;
          prod) fsync=everysec ;;
          *) echo "STREAMS_DURABILITY must be strict or prod, not '$$STREAMS_DURABILITY'" >&2; exit 64 ;;
        esac
        exec docker-entrypoint.sh "$$@" --appendfsync "$$fsync"
      - redis-entrypoint
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "yes"
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --save
      - ""
      - --notify-keyspace-events
      - Ex
      - --aclfile
      - /etc/redis/users.acl
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --tls
        - -p
        - "6380"
        - --cacert
        - /certs/ca.crt
        - --cert
        - /certs/client.crt
        - --key
        - /certs/client.key
        - --user
        - admin
        - --pass
        - admin-e2e-not-a-secret
        - --no-auth-warning
        - ping
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"

volumes:
  redis-secure-data:
