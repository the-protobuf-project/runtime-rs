# JetStream for compose.nats.secure.yaml with STREAMS_DURABILITY=prod: the
# server's production default. Every write reaches the OS page cache before
# the publish ack, so it survives the nats-server process dying or a
# `docker restart`; the files are fsynced every 2 minutes (the default
# sync_interval), so a kernel crash or power loss can lose up to the last
# interval on a single replica. Production runs three replicas, where an ack
# means a quorum has the message, which is why NATS ships this default.

jetstream {
  store_dir: "/data"
}
