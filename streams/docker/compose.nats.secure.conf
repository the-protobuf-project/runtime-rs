# NATS server config for compose.nats.secure.yaml: mutual TLS on the client
# port, authentication on top of it, JetStream on disk with every write synced.

listen: 0.0.0.0:4222
# Monitoring is plain HTTP; compose binds it to 127.0.0.1 on the host only.
http: 0.0.0.0:8222

# With a tls block the client port speaks TLS only: a plaintext CONNECT is
# answered with "Secure Connection - TLS Required" and closed.
tls {
  cert_file: "/certs/server.crt"
  key_file: "/certs/server.key"
  ca_file: "/certs/ca.crt"
  # Require a client certificate signed by ca.crt (mutual TLS). The
  # certificate admits the connection; the credentials below then say who it
  # is. (verify_and_map, where the certificate *is* the user, runs on the
  # separate server in compose.nats.certmap.conf: on one listener it takes
  # over from usernames and passwords.)
  verify: true
  timeout: 2
}

# What the e2e suite needs and nothing more: its own subjects, the JetStream
# API, acknowledgements (a JetStream ack is a publish to the $JS.ACK reply
# subject), and inboxes for replies and pull deliveries.
E2E_PERMISSIONS: {
  publish: ["e2e.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
  subscribe: ["e2e.>", "_INBOX.>"]
}

# TEST-ONLY credentials; the broker binds to 127.0.0.1 only.
authorization {
  users: [
    # A username and password.
    { user: "e2e-password", password: "e2e-test-only-password", permissions: $E2E_PERMISSIONS }
    # An NKey; the seed is in compose.nats.secure.nkey.
    { nkey: "UCWA6YQT4YIBL25LZ7XRBANILNFH62PXDAXGDRRF47SVYJ4WQDSS5C7W", permissions: $E2E_PERMISSIONS }
  ]
}

jetstream {
  store_dir: "/data"
  # fsync every write before the publish ack goes out, so an acked message
  # survives the container being killed, not only a graceful stop.
  sync_interval: always
}
