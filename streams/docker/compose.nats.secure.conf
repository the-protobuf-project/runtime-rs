# NATS server config for compose.nats.secure.yaml: mutual TLS on the client
# port, JetStream on disk with every write synced.

listen: 0.0.0.0:4222
# Monitoring is plain HTTP; compose binds it to 127.0.0.1 on the host only.
http: 0.0.0.0:8222

# With a tls block the client port speaks TLS only: a plaintext CONNECT is
# answered with "Secure Connection - TLS Required" and closed.
tls {
  cert_file: "/certs/server.crt"
  key_file: "/certs/server.key"
  ca_file: "/certs/ca.crt"
  # Require a client certificate signed by ca.crt (mutual TLS).
  verify: true
  timeout: 2
}

jetstream {
  store_dir: "/data"
  # fsync every write before the publish ack goes out, so an acked message
  # survives the container being killed, not only a graceful stop.
  sync_interval: always
}
