# NATS server config for the `nats-certmap` service in
# compose.nats.secure.yaml: mutual TLS where the client certificate is the
# user (verify_and_map). No password or NKey is asked for or accepted.

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

tls {
  cert_file: "/certs/server.crt"
  key_file: "/certs/server.key"
  ca_file: "/certs/ca.crt"
  # Verify the client certificate and take the user from its subject.
  verify_and_map: true
  timeout: 2
}

# The same permissions as compose.nats.secure.conf.
E2E_PERMISSIONS: {
  publish: ["e2e.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
  subscribe: ["e2e.>", "_INBOX.>"]
}

authorization {
  users: [
    # The subject of tls/out/client.crt, as tls/generate.sh issues it.
    { user: "CN=tpp-streams-e2e,O=tpp-streams e2e", permissions: $E2E_PERMISSIONS }
  ]
}

jetstream {
  # Inside the container: this server proves authentication, not persistence.
  store_dir: "/data"
}
