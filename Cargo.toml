[workspace]
resolver = "3"
members = ["network", "cache", "agents", "grpc", "database", "telemetry", "streams"]
# Developer tooling, not a published crate: kept out of the workspace so it
# never lands in the CI crate matrix, the release build, or Cargo.lock.
exclude = ["tools/docgen"]

# rumqttc 0.25.1 pins rustls-webpki 0.102.x, which has five RustSec advisories.
# Keep its published source with only the dependency floor raised until upstream
# releases a version that supports the fixed 0.103.x line.
[patch.crates-io]
rumqttc = { path = "vendor/rumqttc" }

# Consumed by tools/docgen, which generates README.md in full.
[workspace.metadata.docgen]
headline = "The Rust runtime underneath code generated from your `.proto` files."
tagline = """
The protobuf project's plugins turn a proto service into storage, messaging, APIs and agent \
tools. What they generate is thin: names, types and specs. The work happens here, in small \
traits with a driver for each backend, so a program written against one database or broker moves \
to another by changing one line. It is the Rust twin of \
[runtime-go](https://github.com/the-protobuf-project/runtime-go), built the Rust way rather than \
as a line-for-line translation, and the two agree on the wire: a message a Go program publishes, \
a Rust one receives, and a trace started in one continues in the other."""
example = """
let orders = streams::typed::<Order>(manager);
let mut placed = orders.subscribe("order.placed", &Default::default()).await?;
orders.publish("order.placed", &Order { user: "ada".into(), total: 42 }, &Default::default()).await?;
let order = placed.next().await;"""
example-intro = "A taste of the streams contract, typed to your own model:"
example-outro = """
Swap the provider behind `manager`, Kafka for NATS or Redis for RabbitMQ, and the rest of the \
program stays as it is."""
telemetry = """
Every crate reports through one handle, [`telemetry`](telemetry): a `Telemetry` holding a meter, \
a tracer and a log sink the application owns, so no application names an OpenTelemetry type or \
adds it to its own `Cargo.toml`. Build it from the telemetry SDK with `Telemetry::from_tpp`, then \
hand the same one to every crate:

| Crate | Turn it on |
| --- | --- |
| streams | `streams::instrument(provider, &telemetry, "nats")`, and `Topic::with_telemetry` for typed topics |
| database | `store::instrument(db, telemetry)` |
| cache | `cache::with_observability(document, telemetry)` |
| network | `ConnectionOptions { telemetry, .. }` |
| agents | `Config { telemetry, .. }` |
| grpc | on by default for every call; `HybridServer::with_telemetry` to choose the signals |

Each unit of work is a span named `<component>.<operation>` and a share of the same metrics in \
every crate, `runtime.operation.count`, `.duration` and `.active`, `runtime.records.read` and \
`.written`, labeled component, backend, operation and outcome, exactly as runtime-go reports them. \
Traces cross every process boundary in W3C `traceparent` headers: a stream message, an HTTP or \
GraphQL request, a gRPC call. `telemetry`'s `testing` feature records all three signals in memory \
for tests."""

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
thiserror = "2.0"
futures-util = "0.3"
futures = "0.3"
tracing = "0.1"
owo-colors = "4"
unicode-width = "0.2"
opentelemetry = "0.33"
opentelemetry-http = "0.33"
http = "1.5"
bytes = "1"
http-body-util = "0.1"
http-body = "1"
async-trait = "0.1"
uuid = { version = "1.29", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# gRPC and the transports the hybrid server speaks. tonic is the repo the gRPC
# organisation points at for Rust: github.com/grpc/grpc-rust redirects here.
tonic = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
tonic-prost = "0.14"
# Decodes a request against its descriptor at runtime, so an interceptor can read the
# message the way Go's `any` lets it, without a generated type in hand.
prost-reflect = "0.16"
prost = "0.14"
axum = "0.8"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header", "trace", "timeout", "cors"] }

# The REST/JSON gateway: google.api.http routes served in-process against the
# tonic services, replacing grpc-gateway. A git tag rather than a crates.io
# version because the `transcode` name on crates.io belongs to an unrelated
# crate.
transcode = { git = "https://github.com/the-protobuf-project/http", tag = "v0.2.0" }

# HTTP/3. quinn is the only h3 backend tonic-h3 considers production-ready.
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# Default features off: they select aws-lc, and everything here runs on ring.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# Rich error details (google.rpc.ErrorInfo, BadRequest, ...) on gRPC statuses.
tonic-types = "0.14"
# The buf.validate rules engine: reads the rules from the descriptors at runtime and
# checks a prost-reflect message against them, which is what protovalidate does in Go.
prost-protovalidate = "0.6"
# Idempotency key names are a SHA-256 of (method, request_id), as in Go.
sha2 = "0.11"
# Compiles the test protos; dev-only.
tonic-prost-build = "0.14"

# Dev-only, but pinned here so every crate tests against the same versions.
tokio-test = "0.4"
wiremock = "0.6"

network = { path = "network", package = "tpp-network", version = "0.1.0" }
cache = { path = "cache", package = "tpp-cache", version = "0.1.0" }
streams = { path = "streams", package = "tpp-streams", version = "0.1.0" }
# Default features off, so each dependent names the protocols it uses: the A2A SDK brings
# reqwest and aws-lc, which a crate serving only MCP should not have to build or audit.
agents = { path = "agents", package = "tpp-agents", version = "0.1.0", default-features = false }

telemetry = { path = "telemetry", package = "tpp-telemetry", version = "0.1.0" }
