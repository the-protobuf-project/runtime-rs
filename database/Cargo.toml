[package]
name = "tpp-database"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Descriptor-driven database capabilities with an InfluxDB 3 time-series backend"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["database", "influxdb", "timeseries", "async"]
categories = ["database", "asynchronous"]

[package.metadata.docgen]
go-source = "runtime-go/database"

[lib]
name = "database"

[features]
default = []
telemetry-sdk = ["telemetry/tpp-sdk"]

[dependencies]
telemetry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
influxdb3-client = "0.3"
futures.workspace = true
base64 = "0.22"
sha2 = "0.10"
reqwest = { workspace = true, features = ["query"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
arrow-array = "59"
arrow-schema = "59"
arrow-flight = "59"
tonic.workspace = true
tokio-stream.workspace = true

