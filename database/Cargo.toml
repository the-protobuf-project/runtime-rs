[package]
name = "tpp-database"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "runtime-go-shaped database contracts: proto records in Postgres, MySQL, SQLite or MongoDB, time series in InfluxDB 3 and Arrow captures"
repository = "https://github.com/the-protobuf-project/runtime-rs"
keywords = ["database", "sql", "mongodb", "influxdb", "async"]
categories = ["database", "asynchronous"]

[package.metadata.docgen]
go-source = "runtime-go/database"
use-for = "Store proto records in Postgres, MySQL, SQLite or MongoDB, and time series in InfluxDB 3 or Arrow captures"

[lib]
name = "database"

[features]
default = ["influxdb"]
telemetry-sdk = ["telemetry/tpp-sdk"]
# The InfluxDB 3 backend. A feature because influxdb3-client 0.3, its latest release, requires
# Arrow 59: turning this off is what leaves a capture-only build on one Arrow major, 60.
influxdb = ["dep:influxdb3-client", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]
# The SQL backend, `database::orm`: runtime-go's `database/orm` over sqlx and sea-query. One
# feature per dialect, so a Postgres service does not compile SQLite's C library and a SQLite
# tool does not link a network client; `orm` turns on all three, as Go's GORM driver claims.
orm = ["orm-postgres", "orm-mysql", "orm-sqlite"]
orm-postgres = ["dep:sqlx", "dep:sea-query", "dep:sea-query-sqlx", "sqlx/postgres", "sea-query/backend-postgres", "sea-query-sqlx/sqlx-postgres"]
orm-mysql = ["dep:sqlx", "dep:sea-query", "dep:sea-query-sqlx", "sqlx/mysql", "sea-query/backend-mysql", "sea-query-sqlx/sqlx-mysql"]
orm-sqlite = ["dep:sqlx", "dep:sea-query", "dep:sea-query-sqlx", "sqlx/sqlite-bundled", "sea-query/backend-sqlite", "sea-query-sqlx/sqlx-sqlite"]
# `database::cached`: a read-through cache in front of any records driver, over tpp-cache.
cached = ["dep:cache"]
# The MongoDB record backend (`database::mongodb`): the official driver over rustls and ring,
# with bson 3. Off by default, so a build that does not store documents links no driver.
mongodb = ["dep:mongodb", "dep:bson"]
# The Redis record backend, `database::redis`: runtime-go's `database/redis`.
redis = ["dep:redis"]
# Makes the `*_live` test targets build. Once on, they fail rather than skip without a server:
# start the one they name from database/docker first.
live-tests = []

[dependencies]
telemetry.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
chrono.workspace = true
influxdb3-client = { version = "0.3", optional = true }
futures.workspace = true
# The record contract (records): messages read and written through their descriptors, and
# the keys a driver generates.
prost.workspace = true
prost-reflect.workspace = true
uuid.workspace = true
ulid = "3"
base64 = "0.23"
sha2 = "0.11"
# Not the workspace's reqwest. Its `rustls` feature turns on aws-lc through rustls-webpki, and
# crate_universe then sees a feature naming a crate it has not wired, which fails a downstream
# Bazel build. `rustls-no-provider` selects none; the client is given a ring config instead,
# the provider influxdb3-client's own reqwest and the rest of this workspace already use.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true, features = ["tls12"] }
# The roots influxdb3-client trusts, so its admin calls and its queries agree on who to trust.
webpki-roots = { version = "1", optional = true }
# The Redis backend's client: the workspace's, so the cache's connection manager is accepted.
redis = { workspace = true, optional = true }
arrow-array = "60"
arrow-schema = "60"
arrow-ipc = "60"
# The SQL backend (feature `orm-*`). No default features: no macros, no `any` driver, no
# migrations; TLS is rustls on ring, as everywhere else in this workspace (never native-tls).
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }
sea-query = { version = "1", optional = true, default-features = false, features = ["thread-safe", "with-chrono"] }
sea-query-sqlx = { version = "0.9", optional = true, default-features = false, features = ["with-chrono"] }
cache = { workspace = true, optional = true }
# `compat-3-3-0` is the driver's required forward-compatibility pledge; `rustls-tls` selects
# ring, as everything else here does; `dns-resolver` resolves `mongodb+srv://` URIs.
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"], optional = true }
bson = { version = "3.1", features = ["serde", "serde_json-1"], optional = true }

[[example]]
name = "capture"
path = "examples/capture/main.rs"
required-features = ["influxdb"]

[[example]]
name = "influxdb"
path = "examples/influxdb/main.rs"
required-features = ["influxdb"]

[[test]]
name = "orm_driver"
path = "tests/orm_driver.rs"
required-features = ["orm-sqlite"]

[[test]]
name = "orm_provider"
path = "tests/orm_provider.rs"
required-features = ["orm-sqlite"]

[[test]]
name = "orm_statements"
path = "tests/orm_statements.rs"
required-features = ["orm-sqlite"]

[[test]]
name = "orm_dialect"
path = "tests/orm_dialect.rs"
required-features = ["orm-sqlite"]

[[test]]
name = "orm_sqlite"
path = "tests/orm_sqlite.rs"
required-features = ["orm-sqlite"]

[[test]]
name = "orm_live"
path = "tests/orm_live.rs"
required-features = ["orm-postgres", "orm-mysql", "live-tests"]

[[test]]
name = "cached"
path = "tests/cached.rs"
required-features = ["cached"]

[[test]]
name = "cached_capabilities"
path = "tests/cached_capabilities.rs"
required-features = ["cached"]

[[test]]
name = "cached_live"
path = "tests/cached_live.rs"
required-features = ["cached", "live-tests"]

[[test]]
name = "mongodb_live"
path = "tests/mongodb_live/main.rs"
required-features = ["mongodb", "live-tests"]

[[test]]
name = "redis_live"
path = "tests/redis_live/main.rs"
required-features = ["redis", "live-tests"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tokio = { workspace = true, features = ["test-util", "signal"] }
wiremock.workspace = true
arrow-flight = "60"
tonic.workspace = true
tokio-stream.workspace = true
# The records tests build their Book descriptor without protoc.
prost-types = "0.14"
# Counts the statements sqlx logs, as Go's orm tests wrap GORM's logger.
tracing.workspace = true
# The mongodb_live test reads stored documents raw.
bson = "3.1"
# The Redis live tests share one connection between the cache and the record store.
cache.workspace = true

